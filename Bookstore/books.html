<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books - BookStore</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="fa-solid fa-book-open"></i> BookStore</a
        >

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="books.html">Books</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
          <a href="cart.html" class="cart-icon" aria-label="View cart">
            <i class="fa-solid fa-cart-shopping"></i>
          </a>
        </div>
      </div>
    </nav>

    <div class="Book container">
      <div class="d-flex justify-content-between align-items-center">
        <h2>All Books</h2>
        <div class="input-group book-search">
          <input
            type="text"
            class="form-control"
            id="searchInput"
            placeholder="Search books..."
          />
          <button class="btn btn-outline-secondary" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-md-3">
          <div class="box-category">
            <h5>Categories</h5>
            <ul>
              <li data-category="All">All</li>
              <li data-category="Fiction">Fiction</li>
              <li data-category="Self Help">Self Help</li>
              <li data-category="Technology">Technology</li>
              <li data-category="Business">Business</li>
              <li data-category="Science">Science</li>
              <li data-category="Others">Others</li>
            </ul>
          </div>
        </div>
        <div class="col-md-9">
          <div class="row g-4" id="books-container"></div>
        </div>
      </div>
    </div>
    <footer class="footer">
      <p>&copy; 2026 BookStore. All rights reserved.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
